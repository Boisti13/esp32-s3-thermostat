# Battery operation. The backlight is most of the draw, and Wi-Fi the rest,
# so nothing is gained by staying half-awake. Instead:
# dim after a few seconds, then deep sleep after "Sleep after" (a setting)
# with the backlight held off. A touch (GT911 INT on GPIO3) or the
# BOOT button wakes it; it boots straight into the last known values and
# the page and room it was showing (kept in RTC memory) and updates them
# once Home Assistant is connected.
# The "Stay awake" switch keeps it awake (for OTA updates, or on USB power).

esphome:
  includes:
    - ${project_dir}/src/main/rtc_cache.h
    - ${project_dir}/src/main/panel_cmd.h
  on_boot:
    # Before the backlight output starts: release the pin held low in sleep
    - priority: 900
      then:
        - lambda: |-
            gpio_hold_dis(GPIO_NUM_1);
            gpio_hold_dis(GPIO_NUM_3);   // touch INT, held low if touch wake was off
            // Why this boot: woken by touch/BOOT, or a reset of some kind
            const char *why = "other";
            if (esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT1) {
              const uint64_t pins = esp_sleep_get_ext1_wakeup_status();
              why = (pins & (1ULL << 3)) ? "touch" : (pins & 1ULL) ? "BOOT button" : "wake pin";
            } else {
              switch (esp_reset_reason()) {
                case ESP_RST_POWERON: why = "power on"; break;
                case ESP_RST_EXT: why = "RST button"; break;
                case ESP_RST_SW: why = "restart/update"; break;
                case ESP_RST_PANIC: why = "crash"; break;
                case ESP_RST_INT_WDT:
                case ESP_RST_TASK_WDT:
                case ESP_RST_WDT: why = "watchdog"; break;
                case ESP_RST_BROWNOUT: why = "brownout (low battery?)"; break;
                default: break;
              }
            }
            id(wake_reason_text) = why;
            ESP_LOGI("wake", "boot reason: %s", why);
    # Logs before the API is up only reach the serial port: publish it too
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: wake_reason
            state: !lambda "return id(wake_reason_text);"
    # Sensors exist, Wi-Fi isn't up yet: show what we knew before sleeping
    - priority: -50
      then:
        - lambda: |-
            if (panel_cache.magic != PANEL_CACHE_MAGIC) return;
            sensor::Sensor *tgt[5] = {id(r0_target), id(r1_target), id(r2_target), id(r3_target), id(r4_target)};
            sensor::Sensor *cur[5] = {id(r0_current), id(r1_current), id(r2_current), id(r3_current), id(r4_current)};
            sensor::Sensor *hum[5] = {id(r0_humidity), id(r1_humidity), id(r2_humidity), id(r3_humidity), id(r4_humidity)};
            sensor::Sensor *valve[5] = {id(r0_valve), id(r1_valve), id(r2_valve), id(r3_valve), id(r4_valve)};
            sensor::Sensor *lo[5] = {id(r0_min), id(r1_min), id(r2_min), id(r3_min), id(r4_min)};
            sensor::Sensor *hi[5] = {id(r0_max), id(r1_max), id(r2_max), id(r3_max), id(r4_max)};
            text_sensor::TextSensor *mode[5] = {id(r0_mode), id(r1_mode), id(r2_mode), id(r3_mode), id(r4_mode)};
            text_sensor::TextSensor *action[5] = {id(r0_action), id(r1_action), id(r2_action), id(r3_action), id(r4_action)};
            text_sensor::TextSensor *preset[5] = {id(r0_preset), id(r1_preset), id(r2_preset), id(r3_preset), id(r4_preset)};
            binary_sensor::BinarySensor *window[5] = {id(r0_window), id(r1_window), id(r2_window), id(r3_window), id(r4_window)};
            for (int k = 0; k < 5; k++) {
              const RoomCache &c = panel_cache.room[k];
              if (!isnan(c.lo)) lo[k]->publish_state(c.lo);
              if (!isnan(c.hi)) hi[k]->publish_state(c.hi);
              if (!isnan(c.tgt)) tgt[k]->publish_state(c.tgt);
              if (!isnan(c.cur)) cur[k]->publish_state(c.cur);
              if (!isnan(c.hum)) hum[k]->publish_state(c.hum);
              if (!isnan(c.valve)) valve[k]->publish_state(c.valve);
              if (c.mode[0]) mode[k]->publish_state(c.mode);
              if (c.action[0]) action[k]->publish_state(c.action);
              if (c.preset[0]) preset[k]->publish_state(c.preset);
              window[k]->publish_state(c.window);
            }
            if (!isnan(panel_cache.outdoor)) id(outdoor_temp).publish_state(panel_cache.outdoor);
            id(main_valve).publish_state(panel_cache.main_valve);
            if (panel_cache.central[0]) id(central_mode).publish_state(panel_cache.central);
            id(sun_up) = panel_cache.sun_up;   // Auto mode starts in the right mode
        - script.execute: refresh_status
    # After the UI is set up (priority -100): back to the page and room it
    # was showing when it went to sleep
    - priority: -200
      then:
        - lambda: |-
            if (panel_cache.magic != PANEL_CACHE_MAGIC) return;
            if (panel_cache.tile < 5) {
              lv_tileview_set_tile_by_index(id(tv_rooms), panel_cache.tile, 0, LV_ANIM_OFF);
              lv_obj_send_event(id(tv_rooms), LV_EVENT_VALUE_CHANGED, nullptr);
            }
            if (panel_cache.page == PANEL_PAGE_MUSIC) id(show_music).execute();
            else if (panel_cache.page == PANEL_PAGE_SETTINGS) id(show_settings).execute();

# Each wake is a reboot that lasts under a minute; with the default
# (boot_is_good_after: 1min) ten sleep cycles would put it in safe mode.
safe_mode:
  boot_is_good_after: 10s

deep_sleep:
  id: sleep_ctl
  # Woken only by these; no timed wake-ups
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO0       # BOOT button (pull-up on the board)
        ignore_strapping_warning: true
      - number: GPIO3       # GT911 INT, low while touched
        ignore_strapping_warning: true
        allow_other_uses: true
        mode:
          input: true
          pullup: true

globals:
  - id: wake_reason_text
    type: std::string
    initial_value: '"other"'

# Last boot's reason (touch, BOOT button, power on, RST button, restart,
# crash, watchdog, brownout): shows spurious wake-ups, which drain the battery
text_sensor:
  - platform: template
    id: wake_reason
    name: Wake reason
    icon: mdi:alarm-light-outline
    entity_category: diagnostic
    update_interval: never

switch:
  - platform: template
    id: stay_awake
    name: Stay awake
    icon: mdi:sleep-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  # Called after "Sleep after" without a touch (src/main/settings.yaml)
  - id: idle_sleep
    mode: single
    then:
      - if:
          condition:
            switch.is_on: stay_awake
          then:
            # Awake on purpose: just darken the screen; a touch brings it
            # back where it was
            - globals.set: { id: dimmed, value: "true" }
            - light.turn_off: backlight
            - lvgl.pause:
          else:
            - script.execute: enter_sleep

  - id: enter_sleep
    mode: single
    then:
      # Let changes made on the screen reach Home Assistant first
      - wait_until:
          condition:
            lambda: |-
              return !id(send_target_r0).is_running() && !id(send_target_r1).is_running() &&
                     !id(send_target_r2).is_running() && !id(send_target_r3).is_running() &&
                     !id(send_target_r4).is_running();
          timeout: 10s
      - script.execute: save_cache
      - light.turn_off: { id: backlight, transition_length: 0s }
      - delay: 50ms
      - lvgl.pause:
      # Panel to sleep: it keeps its own picture and would keep driving the
      # LCD while the ESP32 sleeps. Display off (0x28), sleep in (0x10, needs
      # 120 ms). On wake the driver's start-up sends sleep out and display on.
      - lambda: "panel_command(id(main_display), 0x28);"
      - delay: 20ms
      - lambda: "panel_command(id(main_display), 0x10);"
      - delay: 120ms
      # Wake pins: BOOT always, the touch INT only with Wake by touch. Without
      # it the touch controller sleeps too (INT low, then 0x05 to 0x8040);
      # the driver's reset at the next boot wakes it.
      - lambda: |-
          uint64_t mask = 1ULL << 0;   // BOOT
          if (id(wake_by_touch).state) {
            mask |= 1ULL << 3;
          } else {
            gpio_set_direction(GPIO_NUM_3, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_3, 0);
            delay(5);
            const uint8_t sleep_cmd = 0x05;
            id(main_touch)->write_register16(0x8040, &sleep_cmd, 1);
            gpio_hold_en(GPIO_NUM_3);
          }
          id(sleep_ctl)->set_ext1_wakeup({mask, ESP_EXT1_WAKEUP_ANY_LOW});
      # Keep the backlight driver off while sleeping (the pin would float)
      - lambda: |-
          gpio_set_direction(GPIO_NUM_1, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_1, 0);
          gpio_hold_en(GPIO_NUM_1);
          gpio_deep_sleep_hold_en();
      - deep_sleep.enter: sleep_ctl

  - id: save_cache
    then:
      - lambda: |-
          sensor::Sensor *tgt[5] = {id(r0_target), id(r1_target), id(r2_target), id(r3_target), id(r4_target)};
          sensor::Sensor *cur[5] = {id(r0_current), id(r1_current), id(r2_current), id(r3_current), id(r4_current)};
          sensor::Sensor *hum[5] = {id(r0_humidity), id(r1_humidity), id(r2_humidity), id(r3_humidity), id(r4_humidity)};
          sensor::Sensor *valve[5] = {id(r0_valve), id(r1_valve), id(r2_valve), id(r3_valve), id(r4_valve)};
          sensor::Sensor *lo[5] = {id(r0_min), id(r1_min), id(r2_min), id(r3_min), id(r4_min)};
          sensor::Sensor *hi[5] = {id(r0_max), id(r1_max), id(r2_max), id(r3_max), id(r4_max)};
          text_sensor::TextSensor *mode[5] = {id(r0_mode), id(r1_mode), id(r2_mode), id(r3_mode), id(r4_mode)};
          text_sensor::TextSensor *action[5] = {id(r0_action), id(r1_action), id(r2_action), id(r3_action), id(r4_action)};
          text_sensor::TextSensor *preset[5] = {id(r0_preset), id(r1_preset), id(r2_preset), id(r3_preset), id(r4_preset)};
          binary_sensor::BinarySensor *window[5] = {id(r0_window), id(r1_window), id(r2_window), id(r3_window), id(r4_window)};
          for (int k = 0; k < 5; k++) {
            RoomCache &c = panel_cache.room[k];
            c.tgt = tgt[k]->state; c.cur = cur[k]->state; c.hum = hum[k]->state;
            c.valve = valve[k]->state; c.lo = lo[k]->state; c.hi = hi[k]->state;
            cache_copy(c.mode, sizeof(c.mode), mode[k]->state);
            cache_copy(c.action, sizeof(c.action), action[k]->state);
            cache_copy(c.preset, sizeof(c.preset), preset[k]->state);
            c.window = window[k]->has_state() && window[k]->state;
          }
          panel_cache.outdoor = id(outdoor_temp).state;
          panel_cache.main_valve = id(main_valve).has_state() && id(main_valve).state;
          cache_copy(panel_cache.central, sizeof(panel_cache.central), id(central_mode).state);
          panel_cache.sun_up = id(sun_up);
          // Page and room on screen (the library comes back as the music page)
          lv_obj_t *scr = lv_screen_active();
          panel_cache.page = scr == id(page_settings)->obj                                   ? PANEL_PAGE_SETTINGS
                             : scr == id(page_music)->obj || scr == id(page_library)->obj ? PANEL_PAGE_MUSIC
                                                                                          : PANEL_PAGE_ROOMS;
          panel_cache.tile = (uint8_t) lv_obj_get_index(lv_tileview_get_tile_active(id(tv_rooms)));
          panel_cache.magic = PANEL_CACHE_MAGIC;
