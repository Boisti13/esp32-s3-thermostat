# The LVGL screen: one tileview with a tile per room (src/room/tile.yaml)
# under a fixed status bar (src/main/status_widgets.yaml), dark theme, and
# the idle behaviour (dim, then dark; a touch wakes it).

esphome:
  on_boot:
    - priority: -100
      then:
        # Tiles never scroll (rooms are switched by touch_moved below)
        - lambda: |-
            for (uint32_t k = 0; k < lv_obj_get_child_count(id(tv_rooms)); k++)
              lv_obj_remove_flag(lv_obj_get_child(id(tv_rooms), k), LV_OBJ_FLAG_SCROLLABLE);

globals:
  # Set once a touch has switched rooms; cleared when the next touch starts
  - id: swipe_done
    type: bool
    initial_value: "false"
  # active_brightness as a number, for comparisons in lambdas
  - id: active_brightness_value
    type: float
    initial_value: "${active_brightness_float}"

script:
  # Swipe detection from the touch controller's coordinates (called by the
  # touchscreen's on_update with where the touch started and where it is).
  # 50 px sideways, mostly horizontal: left = next room, right = previous.
  # The room switches right away, and LVGL drops the press so whatever the
  # finger started on isn't clicked. Touches starting on the dial's ring
  # (or its -/+) adjust the target instead.
  - id: touch_moved
    parameters:
      x0: int
      y0: int
      x: int
      y: int
    then:
      - lambda: |-
          if (id(swipe_done)) return;
          const int dx = x - x0, dy = y - y0;
          if (abs(dx) < 50 || abs(dx) < 2 * abs(dy)) return;
          const float rx = x0 - 136, ry = y0 - 150;   // dial centre
          const float r = sqrtf(rx * rx + ry * ry);
          if (r > 70 && r < 125) return;               // on the ring
          id(swipe_done) = true;
          lv_obj_t *tv = id(tv_rooms);
          const int count = (int) lv_obj_get_child_count(tv);
          int idx = (int) lv_obj_get_index(lv_tileview_get_tile_active(tv));
          const int next = dx < 0 ? idx + 1 : idx - 1;
          ESP_LOGI("swipe", "from %d,%d dx=%d dy=%d: room %d -> %d", x0, y0, dx, dy, idx, next);
          if (next < 0 || next >= count) return;
          for (lv_indev_t *in = lv_indev_get_next(nullptr); in != nullptr; in = lv_indev_get_next(in)) {
            lv_indev_reset(in, nullptr);
            lv_indev_wait_release(in);
          }
          lv_tileview_set_tile_by_index(tv, next, 0, LV_ANIM_OFF);
          lv_obj_send_event(tv, LV_EVENT_VALUE_CHANGED, nullptr);

  - id: wake_screen
    then:
      - if:
          condition:
            lambda: "return !id(backlight).current_values.is_on() || id(backlight).current_values.get_brightness() < id(active_brightness_value) - 0.01f;"
          then:
            - light.turn_on: { id: backlight, brightness: "${active_brightness}" }

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  # One whole frame: a room switch goes out in one piece instead of strips
  buffer_size: 100%
  color_depth: 16
  bg_color: col_bg
  default_font: font_body
  # Outlines on black, solid bright fills for what's active. In 16-bit
  # colour a dim fill has only a few shades between it and black, so its
  # rounded corners look stair-stepped; bright edges blend smoothly.
  theme:
    label:
      text_color: col_text
    button:
      bg_color: col_card_hi
      bg_opa: TRANSP
      text_color: col_text
      radius: 14
      border_width: 2
      border_color: col_line
      shadow_width: 0
      pad_all: 6
      pressed:
        bg_opa: COVER
      checked:
        bg_color: col_heat
        bg_opa: COVER
        border_color: col_heat
        text_color: col_bg
  style_definitions:
    - id: st_chip
      text_color: col_text2

  on_idle:
    - timeout: ${idle_dim}
      then:
        - light.turn_on: { id: backlight, brightness: "${dim_brightness}" }
    # Deep sleep on the board, dark screen on the PC demo (idle_sleep script)
    - timeout: ${idle_sleep}
      then:
        - script.execute: idle_sleep

  top_layer:
    widgets: !include status_widgets.yaml

  pages:
    - id: page_main
      bg_color: col_bg
      scrollable: false
      widgets:
        - tileview:
            id: tv_rooms
            width: 100%
            height: 100%
            bg_opa: TRANSP
            scrollbar_mode: "OFF"
            # No drag-scrolling: every frame of a drag redraws the whole
            # screen over SPI (~6 fps). A swipe switches rooms in one redraw
            # instead (touch_moved above).
            scrollable: false
            # Page dots: the current room's dot is a wide bar. on_value: swiped,
            # on_update: selected by the idle timeout.
            on_value: &update_dots
              - lambda: |-
                  lv_obj_t *tiles[5] = {id(tile_r0), id(tile_r1), id(tile_r2), id(tile_r3), id(tile_r4)};
                  lv_obj_t *dots[5] = {id(dot_0), id(dot_1), id(dot_2), id(dot_3), id(dot_4)};
                  for (int k = 0; k < 5; k++) {
                    const bool cur = tile == tiles[k];
                    lv_obj_set_width(dots[k], cur ? 18 : 6);
                    lv_obj_set_style_bg_color(dots[k], lv_color_hex(cur ? 0x${hex_text} : 0x${hex_off}), 0);
                  }
            on_update: *update_dots
            tiles:
              - !include { file: ../room/tile.yaml, vars: { i: "0", name: "${room_0_name}" } }
              - !include { file: ../room/tile.yaml, vars: { i: "1", name: "${room_1_name}" } }
              - !include { file: ../room/tile.yaml, vars: { i: "2", name: "${room_2_name}" } }
              - !include { file: ../room/tile.yaml, vars: { i: "3", name: "${room_3_name}" } }
              - !include { file: ../room/tile.yaml, vars: { i: "4", name: "${room_4_name}" } }
