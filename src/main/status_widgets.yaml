# Widgets on LVGL's top layer (above every room tile), filled in by the
# refresh_status script in src/main/status.yaml and the tileview's on_value.

- label:
    id: lbl_clock
    x: 14
    y: 8
    text: "--:--"
    text_font: font_body
    text_color: col_text2

# Right side: [central stopped] [no connection] [flame] [outdoor]
- obj:
    align: TOP_RIGHT
    x: -10
    y: 6
    width: SIZE_CONTENT
    height: SIZE_CONTENT
    bg_opa: TRANSP
    border_width: 0
    pad_all: 0
    clickable: false
    layout:
      type: flex
      flex_flow: ROW
      flex_align_cross: CENTER
      pad_column: 10
    widgets:
      - label:
          id: lbl_central
          text: "${ic_stop} Stopped"
          text_font: font_small
          text_color: col_warn
          hidden: true
      - label:
          id: lbl_offline
          text: "${ic_offline}"
          text_font: font_body
          text_color: col_warn
      - label:
          id: lbl_main_valve
          text: "${ic_fire}"
          text_font: font_body
          text_color: col_heat
          hidden: true
      - label:
          id: lbl_outdoor
          text: ""
          text_font: font_body
          text_color: col_text2
          hidden: true

# Page dots, one per room
- obj:
    align: BOTTOM_MID
    x: -104
    y: -4
    width: SIZE_CONTENT
    height: SIZE_CONTENT
    bg_opa: TRANSP
    border_width: 0
    pad_all: 0
    clickable: false
    layout:
      type: flex
      flex_flow: ROW
      flex_align_cross: CENTER
      pad_column: 6
    widgets:
      - obj: { id: dot_0, width: 18, height: 6, radius: 3, bg_color: col_text, border_width: 0, pad_all: 0, clickable: false }
      - obj: { id: dot_1, width: 6, height: 6, radius: 3, bg_color: col_off, border_width: 0, pad_all: 0, clickable: false }
      - obj: { id: dot_2, width: 6, height: 6, radius: 3, bg_color: col_off, border_width: 0, pad_all: 0, clickable: false }
      - obj: { id: dot_3, width: 6, height: 6, radius: 3, bg_color: col_off, border_width: 0, pad_all: 0, clickable: false }
      - obj: { id: dot_4, width: 6, height: 6, radius: 3, bg_color: col_off, border_width: 0, pad_all: 0, clickable: false }
