substitutions:
  # Change these to match your Home Assistant instance before flashing.

  # Rooms, in swipe order: the room the panel hangs in goes first, it is the
  # one shown after boot and after the screen wakes up.
  # *_entity: the room's climate entity (Versatile Thermostat, or any climate
  #   with hvac_mode heat/off and the presets below).
  # *_window: a door/window contact; binary_sensor.none = no sensor.
  # Names are shown on the panel: plain letters, digits and spaces.
  room_0_name: "Living Room"
  room_0_entity: climate.living_room_radiator
  room_0_window: binary_sensor.balcony_door_contact
  room_1_name: "Kitchen"
  room_1_entity: climate.kitchen_radiator
  room_1_window: binary_sensor.kitchen_window_contact
  room_2_name: "Bedroom"
  room_2_entity: climate.bedroom_radiator
  room_2_window: binary_sensor.bedroom_window_contact
  room_3_name: "Arthur"
  room_3_entity: climate.arthur_radiator
  room_3_window: binary_sensor.arthur_window_contact
  room_4_name: "Bathroom"
  room_4_entity: climate.bathroom_radiator
  room_4_window: binary_sensor.none

  # Status bar
  outdoor_temperature_entity: sensor.virtual_outdoor_temperature
  # Main heating supply (shown as a flame while on); switch.none = hide
  main_valve_entity: switch.heat_exchanger
  # Versatile Thermostat central mode; "Stopped" is shown as a warning
  central_mode_entity: select.central_mode

  # Music page (♫ bottom left): up to four media players to pick from, e.g.
  # Music Assistant players (their names come from Home Assistant);
  # media_player.none = unused. ha_url is Home Assistant's address as the
  # panel reaches it, for covers served by Home Assistant itself (Music
  # Assistant's come from Music Assistant).
  music_0_entity: media_player.living_room_speaker
  music_1_entity: media_player.none
  music_2_entity: media_player.none
  music_3_entity: media_player.none
  ha_url: "http://192.168.178.108:8123"
  # Music Assistant's config entry ID in Home Assistant, for the library
  # (Settings → Devices & services → Music Assistant → ⋮ → entry ID, or
  # the URL of its page)
  music_assistant_entry: "01M5Z4KR19SV8HG7BJG3KAYP3P"

  # Screen: dims after idle_dim_s seconds without a touch, to
  # dim_brightness_f (0-1). Brightness, "Sleep after" and the colour scheme
  # are settings (⋯ on the panel, or the entities in Home Assistant); these
  # are their values on the first boot.
  idle_dim_s: "15"
  dim_brightness_f: "0.15"
  default_brightness: "70"
  default_sleep: "1 min"
  default_scheme: "Ember"
  default_mode: "Auto"   # Dark, Light or Auto (light while the sun is up)
