# Colours (dark mode; light mode counterparts in src/main/palette.h), fonts
# and icons. Every colour exists twice: as a
# hex_* substitution (used in C++ lambdas as lv_color_hex(0x${hex_*})) and as
# a col_* colour (used in YAML styles). Change the hex_* value only.

substitutions:
  # This panel stretches dark shades a lot and tints them teal (the old navy
  # #161C27 came out bright teal). So: pure black background, neutral greys
  # (R = G = B), dark tones darker than they look on a monitor.
  hex_bg: "000000"        # screen background (black stays black)
  hex_card_hi: "3A3A3A"   # pressed button fill
  hex_line: "4A4A4A"      # button outlines
  hex_track: "303030"     # arc background
  hex_text: "F0F0F0"
  hex_text2: "9A9A9A"     # captions, secondary values
  hex_heat: "FF7A2F"      # heating
  hex_idle: "4C9BFF"      # on, not heating right now
  hex_off: "3C3C3C"       # off
  hex_warn: "FFC042"      # window open, central mode stopped, no connection

  # Icons (Material Design Icons code points)
  ic_fire: "\U000F0238"
  ic_power: "\U000F0425"
  ic_leaf: "\U000F032A"
  ic_snowflake: "\U000F0717"
  ic_rocket: "\U000F14DE"
  ic_sofa: "\U000F04B9"
  ic_water: "\U000F058E"
  ic_thermometer: "\U000F050F"
  ic_window: "\U000F11DC"
  ic_plus: "\U000F0415"
  ic_minus: "\U000F0374"
  ic_valve: "\U000F1066"
  ic_cloud: "\U000F0595"
  ic_stop: "\U000F0AD8"   # radiator-off
  ic_menu: "\U000F01D8"   # dots-horizontal
  ic_back: "\U000F0141"   # chevron-left
  ic_sun: "\U000F0599"    # weather-sunny
  ic_moon: "\U000F0594"   # weather-night
  ic_auto: "\U000F050E"   # theme-light-dark
  ic_offline: "\U000F0319"
  ic_battery: "\U000F0079"
  ic_battery_50: "\U000F007E"
  ic_battery_20: "\U000F007B"
  ic_battery_alert: "\U000F10CD"

  text_glyphs: " !#%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz|°·–"

color:
  - { id: col_bg, hex: "${hex_bg}" }
  - { id: col_card_hi, hex: "${hex_card_hi}" }
  - { id: col_line, hex: "${hex_line}" }
  - { id: col_track, hex: "${hex_track}" }
  - { id: col_text, hex: "${hex_text}" }
  - { id: col_text2, hex: "${hex_text2}" }
  - { id: col_heat, hex: "${hex_heat}" }
  - { id: col_idle, hex: "${hex_idle}" }
  - { id: col_off, hex: "${hex_off}" }
  - { id: col_warn, hex: "${hex_warn}" }

font:
  # Big target temperature in the dial
  - file: { type: gfonts, family: Inter, weight: 400 }
    id: font_target
    size: 60
    bpp: 4
    glyphs: "0123456789.-–Of"
  - file: { type: gfonts, family: Inter, weight: 400 }
    id: font_degree
    size: 30
    bpp: 4
    glyphs: "°"
  # Room name
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: font_title
    size: 20
    bpp: 4
    glyphs: "${text_glyphs}"
    extras:
      - file: ${project_dir}/src/assets/fonts/materialdesignicons-webfont.ttf
        glyphs: ["${ic_window}"]
  # Values: room temperature, humidity, status bar
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: font_body
    size: 16
    bpp: 4
    glyphs: "${text_glyphs}"
    extras:
      - file: ${project_dir}/src/assets/fonts/materialdesignicons-webfont.ttf
        glyphs: ["${ic_fire}", "${ic_thermometer}", "${ic_water}", "${ic_valve}",
                 "${ic_cloud}", "${ic_stop}", "${ic_offline}", "${ic_power}", "${ic_window}",
                 "${ic_battery}", "${ic_battery_50}", "${ic_battery_20}", "${ic_battery_alert}"]
  # Big values on the stat tiles
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: font_value
    size: 22
    bpp: 4
    glyphs: "0123456789.,-–% °"
  # Captions and the status line above the target
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: font_small
    size: 12
    bpp: 4
    glyphs: "${text_glyphs}"
    extras:
      - file: ${project_dir}/src/assets/fonts/materialdesignicons-webfont.ttf
        glyphs: ["${ic_fire}", "${ic_window}", "${ic_stop}", "${ic_water}", "${ic_valve}"]
  # Icons on buttons and tiles
  - file: ${project_dir}/src/assets/fonts/materialdesignicons-webfont.ttf
    id: font_icon
    size: 24
    bpp: 4
    glyphs: ["${ic_sofa}", "${ic_leaf}", "${ic_snowflake}", "${ic_rocket}", "${ic_power}",
             "${ic_plus}", "${ic_minus}", "${ic_menu}", "${ic_back}",
             "${ic_sun}", "${ic_moon}", "${ic_auto}"]
