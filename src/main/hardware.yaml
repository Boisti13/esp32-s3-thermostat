# Guition JC4827W543C: ESP32-S3-WROOM-1 N4R8 (4 MB flash, 8 MB octal
# PSRAM), 4.3" 480x272 IPS panel with an NV3041A controller on quad SPI
# (the panel keeps its own picture), GT911 capacitive touch.
# Pins from ESPHome's built-in JC4827W543 model and the device page
# devices.esphome.io/devices/guition-jc4827543c.

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO47
    data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  - platform: mipi_spi
    id: main_display
    model: JC4827W543   # NV3041A, CS on GPIO45, init sequence built in
    spi_id: display_qspi
    # The board's natural orientation is upside down: turn it 180° in the
    # panel itself (LVGL doesn't allow a display rotation)
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    update_interval: never
    auto_clear_enabled: false

i2c:
  - id: touch_i2c
    sda: GPIO8
    scl: GPIO4
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: main_touch
    i2c_id: touch_i2c
    display: main_display
    # INT also wakes the panel from deep sleep (src/main/power.yaml)
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
      allow_other_uses: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true
    on_release:
      # A touch while the screen is dark only wakes it.
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_touch:
      - script.execute: wake_screen

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO1
    frequency: 1000Hz   # the backlight driver's tested frequency

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    icon: mdi:brightness-6
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
