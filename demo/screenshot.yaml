# The panel's UI on a PC: same screen, SDL window instead of the board,
# made-up values instead of Home Assistant. Used for the README screenshots
# (scripts/screenshots.sh on Linux); handy for trying out layout changes
# without flashing.
#
#   esphome run demo/screenshot.yaml     # needs libsdl2-dev

substitutions:
  project_dir: ".."
  device_name: thermostat-demo
  friendly_name: Thermostat Demo
  # Two more (made-up) speakers for the speaker list
  music_1_entity: media_player.demo_kitchen
  music_2_entity: media_player.demo_bedroom

packages:
  entities: !include ../src/main/entities.yaml
  theme: !include ../src/main/theme.yaml
  status: !include ../src/main/status.yaml
  ui: !include ../src/main/ui.yaml
  settings: !include ../src/main/settings.yaml
  music: !include ../src/music/music.yaml
  music_0: !include { file: ../src/music/player.yaml, vars: { p: "0", entity: "${music_0_entity}" } }
  music_1: !include { file: ../src/music/player.yaml, vars: { p: "1", entity: "${music_1_entity}" } }
  music_2: !include { file: ../src/music/player.yaml, vars: { p: "2", entity: "${music_2_entity}" } }
  music_3: !include { file: ../src/music/player.yaml, vars: { p: "3", entity: "${music_3_entity}" } }
  room_0: !include { file: ../src/room/room.yaml, vars: { i: "0", entity: "${room_0_entity}", window: "${room_0_window}" } }
  room_1: !include { file: ../src/room/room.yaml, vars: { i: "1", entity: "${room_1_entity}", window: "${room_1_window}" } }
  room_2: !include { file: ../src/room/room.yaml, vars: { i: "2", entity: "${room_2_entity}", window: "${room_2_window}" } }
  room_3: !include { file: ../src/room/room.yaml, vars: { i: "3", entity: "${room_3_entity}", window: "${room_3_window}" } }
  room_4: !include { file: ../src/room/room.yaml, vars: { i: "4", entity: "${room_4_entity}", window: "${room_4_window}" } }

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            // room: mode, action, preset, target, current, humidity, valve, window
            struct Demo { const char *mode, *action, *preset; float tgt, cur, hum, valve; bool window; };
            static const Demo D[5] = {
              {"heat", "heating", "comfort", 21.5, 20.4, 55, 38, false},
              {"heat", "idle",    "eco",     19.0, 19.6, 59, 0,  false},
              {"heat", "idle",    "frost",   5.0,  18.2, 62, 0,  true},
              {"off",  "off",     "none",    5.0,  22.0, 55, 0,  false},
              {"heat", "heating", "boost",   23.0, 21.2, 71, 80, false},
            };
            sensor::Sensor *tgt[5] = {id(r0_target), id(r1_target), id(r2_target), id(r3_target), id(r4_target)};
            sensor::Sensor *cur[5] = {id(r0_current), id(r1_current), id(r2_current), id(r3_current), id(r4_current)};
            sensor::Sensor *hum[5] = {id(r0_humidity), id(r1_humidity), id(r2_humidity), id(r3_humidity), id(r4_humidity)};
            sensor::Sensor *valve[5] = {id(r0_valve), id(r1_valve), id(r2_valve), id(r3_valve), id(r4_valve)};
            sensor::Sensor *lo[5] = {id(r0_min), id(r1_min), id(r2_min), id(r3_min), id(r4_min)};
            sensor::Sensor *hi[5] = {id(r0_max), id(r1_max), id(r2_max), id(r3_max), id(r4_max)};
            text_sensor::TextSensor *mode[5] = {id(r0_mode), id(r1_mode), id(r2_mode), id(r3_mode), id(r4_mode)};
            text_sensor::TextSensor *action[5] = {id(r0_action), id(r1_action), id(r2_action), id(r3_action), id(r4_action)};
            text_sensor::TextSensor *preset[5] = {id(r0_preset), id(r1_preset), id(r2_preset), id(r3_preset), id(r4_preset)};
            binary_sensor::BinarySensor *window[5] = {id(r0_window), id(r1_window), id(r2_window), id(r3_window), id(r4_window)};
            for (int k = 0; k < 5; k++) {
              lo[k]->publish_state(5); hi[k]->publish_state(25);
              tgt[k]->publish_state(D[k].tgt); cur[k]->publish_state(D[k].cur);
              hum[k]->publish_state(D[k].hum); valve[k]->publish_state(D[k].valve);
              mode[k]->publish_state(D[k].mode); action[k]->publish_state(D[k].action);
              preset[k]->publish_state(D[k].preset); window[k]->publish_state(D[k].window);
            }
            id(outdoor_temp).publish_state(9.5);
            id(main_valve).publish_state(true);
            id(central_mode).publish_state("Heat only");
            id(force_connected) = true;
            // Music: made-up speakers and track, generated cover (demo/cover.png)
            id(m0_state).publish_state("playing");
            id(m0_name).publish_state("Living Room Speaker");
            id(m0_title).publish_state("Morgenlicht über dem Fluss");
            id(m0_artist).publish_state("Example Ensemble");
            id(m0_album).publish_state("Demo Sessions · Vol. 2");
            id(m0_duration).publish_state(245);
            id(m0_position).publish_state(97);
            id(m0_volume).publish_state(0.42);
            id(m0_shuffle).publish_state(true);
            id(m0_repeat).publish_state("off");
            id(m0_muted).publish_state(false);
            id(m0_group).publish_state("['media_player.living_room_speaker', 'media_player.demo_bedroom']");
            id(m1_state).publish_state("paused");
            id(m1_name).publish_state("Kitchen Speaker");
            id(m1_title).publish_state("Café am Marktplatz");
            id(m2_state).publish_state("playing");
            id(m2_title).publish_state("Morgenlicht über dem Fluss");
            id(m2_name).publish_state("Bedroom Speaker");
            id(music_cover_fixed) = true;
        - lvgl.image.update: { id: mus_art, src: demo_cover }
        - lvgl.widget.show: mus_art
        - lvgl.widget.hide: mus_art_none
        - script.execute: refresh_status

host:

image:
  - platform: file
    file: cover.png
    id: demo_cover
    type: RGB565

logger:
  level: INFO

# Status bar and room sensors are Home Assistant sensors; the API makes them
# compile, nothing connects in the demo.
api:

display:
  - platform: sdl
    id: main_display
    dimensions:
      width: 480
      height: 272
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: sdl
    id: main_touch
    display: main_display
    on_touch:
      - lambda: "id(swipe_done) = false;"
    on_update:
      - lambda: |-
          if (!touches.empty())
            id(touch_moved).execute(touches[0].x_org, touches[0].y_org, touches[0].x, touches[0].y);

output:
  - platform: template
    id: backlight_pwm
    type: float
    write_action: []

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

# The board deep-sleeps here (src/main/power.yaml); the demo only goes dark
script:
  - id: idle_sleep
    then:
      - globals.set: { id: dimmed, value: "true" }
      - light.turn_off: backlight
      - lvgl.pause:

# Show each room in turn, then the settings page, room 0 in the Ocean
# scheme, room 0 and the settings page in light mode, and the music page
# in dark and light mode, and the speaker list (for the screenshot script)
interval:
  - interval: 3s
    then:
      - lambda: |-
          static int n = -1;   // first run (at boot) shows room 0
          n = (n + 1) % 12;
          auto scheme = [](const char *name) { id(color_scheme).make_call().set_option(name).perform(); };
          auto mode = [](const char *name) { id(appearance).make_call().set_option(name).perform(); };
          int tile = n;
          switch (n) {
            case 0: lv_obj_add_flag(id(mus_picker), LV_OBJ_FLAG_HIDDEN); id(show_rooms).execute(); mode("Dark"); scheme("Ember"); break;
            case 5: id(show_settings).execute(); return;
            case 6: id(show_rooms).execute(); scheme("Ocean"); tile = 0; break;
            case 7: scheme("Ember"); mode("Light"); tile = 0; break;
            case 8: id(show_settings).execute(); return;
            case 9: id(show_music).execute(); return;
            case 10: mode("Dark"); return;
            case 11: id(show_music_picker).execute(); return;
          }
          lv_obj_t *tiles[5] = {id(tile_r0), id(tile_r1), id(tile_r2), id(tile_r3), id(tile_r4)};
          lv_tileview_set_tile(id(tv_rooms), tiles[tile], LV_ANIM_OFF);
          lv_obj_send_event(id(tv_rooms), LV_EVENT_VALUE_CHANGED, nullptr);
